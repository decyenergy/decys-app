<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Decy’s Energy">
<meta name="theme-color" content="#0f2233">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>Decy’s Energy Solution</title>
<style>
:root{--bg:#f3f6f9;--card:#fff;--ink:#0f2233;--mute:#5d6f7e;--line:#dbe3ea;--flame:#1f6feb;--good:#13805a;--bad:#c23b3b;--tile:#eaf0f6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#07111b;--card:#0e1c2a;--ink:#e8f0f7;--mute:#8da1b2;--line:#1d3043;--flame:#5aa2ff;--good:#4cc795;--bad:#ff7b7b;--tile:#122436;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sub{color:var(--mute);font-size:14px;margin:0 0 14px}
.link{background:none;border:0;color:var(--flame);font:inherit;font-size:14px;cursor:pointer;padding:6px}
nav{display:flex;gap:4px;background:var(--tile);padding:4px;border-radius:12px;margin-bottom:14px}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:10px 2px;border-radius:9px;font:inherit;font-weight:600;font-size:13px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--tile);border-radius:10px;padding:12px}
.tile small{display:block;color:var(--mute);font-size:13px}
.tile b{font-size:22px}
.profit{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
.profit b{font-size:26px;color:var(--good)}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}.row>span:first-child{color:var(--mute)}
.prow{cursor:pointer}.prow>span:first-child{color:var(--ink)}
.ok{color:var(--good)}.warn{color:var(--bad)}
h2{font-size:16px;margin:0 0 8px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:10px}
input,select{width:100%;margin-top:4px;padding:11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--flame);outline-offset:1px}
.btn{width:100%;padding:13px;border:0;border-radius:11px;background:var(--flame);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.seg{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:none;color:var(--mute);padding:8px 16px;border-radius:20px;font:inherit;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--flame);border-color:var(--flame);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:480px}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--mute);font-weight:600}
tr[data-day]{cursor:pointer}
.note{font-size:13px;color:var(--mute)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px}
@media print{
:root{--bg:#fff;--card:#fff;--ink:#000;--mute:#444;--line:#ccc;--tile:#f2f2f2;--good:#0a6b4a;--bad:#b00;padding:0}
nav,.noprint,.top button,.toast{display:none!important}
.card{break-inside:avoid;border-color:#ccc}
}
</style>
</head>
<body>
<main>
<div class="top"><div><h1>Decy’s Energy Solution</h1><p class="sub" id="who"></p></div><button class="link" id="out" hidden>Sign out</button></div>
<div id="app"><div class="card note">Loading…</div></div>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,deleteDoc,collection,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyCqvBAgLTmb9uHwQ5Vg1hknIAbGz7cwGNs",
  authDomain:"decys-energy.firebaseapp.com",
  projectId:"decys-energy",
  storageBucket:"decys-energy.firebasestorage.app",
  messagingSenderId:"150470704958",
  appId:"1:150470704958:web:c1c1b0fc711e8cec80f66f"
});
const auth=getAuth(app),db=getFirestore(app);
const N=n=>"₦"+Math.round(n).toLocaleString("en-NG"),K=n=>(Math.round(n*10)/10).toLocaleString("en-NG")+"kg";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
let me=null,isOwner=false,tab="report",sales=[],costs={},msg="",unsubs=[];
let ledgers={customer:[],supplier:[]},bal={kind:"customer",party:null,mode:"list"};
let invLog=[],inv={view:"stock",item:null,mode:"list"};
let hist={day:null,from:"",to:""};

function loginView(err=""){
 $("who").textContent="Staff sign-in";$("out").hidden=true;
 $("app").innerHTML=`<div class="card"><h2>Sign in</h2>
 <label>Email<input id="em" type="email" autocomplete="username"></label>
 <label>Password<input id="pw" type="password" autocomplete="current-password"></label>
 <p class="warn note" id="err">${err}</p><button class="btn" id="go">Sign in</button></div>`;
 const go=async()=>{try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value)}catch(e){$("err").textContent="Wrong email or password."}};
 $("go").onclick=go;$("pw").onkeydown=e=>{if(e.key=="Enter")go()}}

function rows(){return sales.map(d=>{
 const cost=costs[d.date],total=d.sold*d.price,expected=d.open+d.recv-d.sold,diff=d.count-expected,credit=total-d.cash-d.bank;
 const gross=cost==null?null:d.sold*(d.price-cost);
 return {...d,cost,total,expected,diff,credit,gross,op:gross==null?null:gross-d.exp}})}
const who=r=>r.by||"Staff";
function report(r){
 const dc=Math.abs(r.diff)<1?"ok":"warn";
 const money=isOwner?(r.gross==null?`<div class="card note">Add the cost per kg for ${r.date} (Add day tab) to see profit.</div>`:`<div class="profit"><span><b style="font-size:16px;color:var(--ink)">Operating profit</b><br><span class="note">Before finance costs, taxes and other unallocated expenses.</span></span><b>${N(r.op)}</b></div>`):"";
 return `<div class="card"><h2>${r.date} · Daily report</h2><div class="grid">
 <div class="tile"><small>Total sales</small><b>${N(r.total)}</b></div>
 <div class="tile"><small>Quantity sold</small><b>${K(r.sold)}</b></div>
 <div class="tile"><small>${isOwner?"Gross contribution":"Selling price / kg"}</small><b>${isOwner?(r.gross==null?"–":N(r.gross)):N(r.price)}</b></div>
 <div class="tile"><small>Operating expenses</small><b>${N(r.exp)}</b></div></div>${money}</div>
 <div class="card"><h2>Stock reconciliation</h2>
 <div class="row"><span>Opening stock</span><span>${K(r.open)}</span></div>
 <div class="row"><span>Stock received</span><span>${K(r.recv)}</span></div>
 <div class="row"><span>Sold</span><span>${K(r.sold)}</span></div>
 <div class="row"><span>Expected closing</span><span>${K(r.expected)}</span></div>
 <div class="row"><span>Physical count</span><span>${K(r.count)}</span></div>
 <div class="row"><span>Discrepancy</span><b class="${dc}">${r.diff>0?"+":""}${K(r.diff)} ${dc=="ok"?"✓":"· investigate"}</b></div></div>
 <div class="card"><h2>Cash and credit</h2>
 <div class="row"><span>Cash received</span><span>${N(r.cash)}</span></div>
 <div class="row"><span>Bank received</span><span>${N(r.bank)}</span></div>
 <div class="row"><span>Sales not yet paid</span><b class="${r.credit>0?"warn":"ok"}">${N(Math.max(r.credit,0))}</b></div>
 <div class="row"><span>Entered by</span><span>${who(r)}</span></div></div>`}

/* ---------- History and statements ---------- */
function historyView(rs){
 if(hist.day){
  const r=rs.find(x=>x.date==hist.day);
  if(r)return `<div class="noprint"><button class="link" id="hback">‹ All days</button><button class="link" id="hprint">Print / Save PDF</button></div>`+report(r);
  hist.day=null}
 const f=hist.from||"0000-00-00",t=hist.to||"9999-99-99",sel=rs.filter(r=>r.date>=f&&r.date<=t);
 const sum=k=>sel.reduce((a,r)=>a+(r[k]||0),0);
 const period=(hist.from||hist.to)?`${hist.from||"start"} to ${hist.to||"today"}`:"All days";
 const withCost=sel.filter(r=>r.gross!=null),missing=sel.length-withCost.length;
 const unpaid=sel.reduce((a,r)=>a+Math.max(r.credit,0),0),gaps=sel.filter(r=>Math.abs(r.diff)>=1).length,netGap=sum("diff");
 const per={};sel.forEach(r=>{const p=per[who(r)]=per[who(r)]||{s:0,k:0,d:0,n:0};p.s+=r.total;p.k+=r.sold;p.d+=Math.abs(r.diff);p.n++});
 const ownerRows=isOwner?`<div class="tile"><small>Gross contribution</small><b>${N(withCost.reduce((a,r)=>a+r.gross,0))}</b></div>`:"";
 return `<div class="card noprint"><h2>Statement period</h2>
 <div class="seg"><button data-pre="month">This month</button><button data-pre="last">Last month</button><button data-pre="all">All</button></div>
 <div class="two"><label>From<input id="hfrom" type="date" value="${hist.from}"></label><label>To<input id="hto" type="date" value="${hist.to}"></label></div>
 <button class="link" id="hprint" style="padding-left:0">Print / Save PDF</button></div>
 <div class="card"><h2>Statement · ${period}</h2><p class="note">${sel.length} day${sel.length==1?"":"s"}</p>
 <div class="grid"><div class="tile"><small>Total sales</small><b>${N(sum("total"))}</b></div>
 <div class="tile"><small>Quantity sold</small><b>${K(sum("sold"))}</b></div>
 ${ownerRows}
 <div class="tile"><small>Operating expenses</small><b>${N(sum("exp"))}</b></div></div>
 ${isOwner?(withCost.length?`<div class="profit"><span><b style="font-size:16px;color:var(--ink)">Operating profit</b><br><span class="note">${missing?missing+" day"+(missing==1?"":"s")+" without a cost per kg not counted.":"Before finance costs, taxes and other unallocated expenses."}</span></span><b>${N(withCost.reduce((a,r)=>a+r.op,0))}</b></div>`:`<p class="note">Add a cost per kg to see profit for this period.</p>`):""}</div>
 <div class="card"><h2>Cash, credit and stock</h2>
 <div class="row"><span>Cash received</span><span>${N(sum("cash"))}</span></div>
 <div class="row"><span>Bank received</span><span>${N(sum("bank"))}</span></div>
 <div class="row"><span>Sales not yet paid</span><b class="${unpaid>0?"warn":"ok"}">${N(unpaid)}</b></div>
 <div class="row"><span>Days with a stock gap</span><b class="${gaps?"warn":"ok"}">${gaps}</b></div>
 <div class="row"><span>Net stock difference</span><b class="${Math.abs(netGap)<1?"ok":"warn"}">${netGap>0?"+":""}${K(netGap)}</b></div></div>
 <div class="card"><h2>Days</h2><p class="note noprint">Tap a day to open its full statement.</p><div class="scroll"><table><tr><th>Date</th><th>Sales</th><th>Kg</th>${isOwner?"<th>Profit</th>":""}<th>Stock diff</th><th>Credit</th></tr>
 ${sel.slice().reverse().map(r=>`<tr data-day="${r.date}"><td>${r.date.slice(5)}</td><td>${N(r.total)}</td><td>${r.sold}</td>${isOwner?`<td>${r.op==null?"–":N(r.op)}</td>`:""}<td class="${Math.abs(r.diff)<1?"ok":"warn"}">${r.diff>0?"+":""}${Math.round(r.diff*10)/10}</td><td>${N(Math.max(r.credit,0))}</td></tr>`).join("")||`<tr><td colspan="6" class="note">No days in this period.</td></tr>`}</table></div></div>
 ${isOwner&&sel.length?`<div class="card"><h2>Employee performance</h2>${Object.entries(per).map(([n,p])=>`<div class="row"><span>${esc(n)} · ${p.n} day${p.n>1?"s":""}</span><span>${N(p.s)} · ${p.k}kg · <span class="${p.d<1?"ok":"warn"}">${Math.round(p.d*10)/10}kg stock gap</span></span></div>`).join("")}</div>`:""}`}
function wireHist(){
 const w=$("view"),go=()=>{$("view").innerHTML="";render()};
 const bk=$("hback");if(bk)bk.onclick=()=>{hist.day=null;go()};
 const pr=$("hprint");if(pr)pr.onclick=()=>window.print();
 const fr=$("hfrom");if(fr)fr.onchange=()=>{hist.from=fr.value;go()};
 const to=$("hto");if(to)to.onchange=()=>{hist.to=to.value;go()};
 w.querySelectorAll("[data-pre]").forEach(b=>b.onclick=()=>{
  const p=b.dataset.pre,n=new Date(),y=n.getUTCFullYear(),m=n.getUTCMonth(),iso=d=>d.toISOString().slice(0,10);
  if(p=="month"){hist.from=iso(new Date(Date.UTC(y,m,1)));hist.to=today()}
  else if(p=="last"){hist.from=iso(new Date(Date.UTC(y,m-1,1)));hist.to=iso(new Date(Date.UTC(y,m,0)))}
  else{hist.from="";hist.to=""}
  go()});
 w.querySelectorAll("tr[data-day]").forEach(tr=>tr.onclick=()=>{hist.day=tr.dataset.day;go()})}

const nextDate=s=>{const d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+1);return d.toISOString().slice(0,10)};
function entry(rs){
 const l=rs[rs.length-1],f=(id,lab,v,t="number")=>`<label>${lab}<input id="${id}" type="${t}" inputmode="decimal" step="any" value="${v}"></label>`;
 return `<div class="card"><h2>Add a day</h2>
 <p class="note">${l?`Opening stock comes from the last physical count (${K(l.count)}).`:"First entry: type your current stock as the opening stock."}</p>
 ${f("date","Date",l?nextDate(l.date):today(),"date")}
 ${l?"":f("open","Opening stock (kg)","")}
 ${f("sold","Kilograms sold","")}${f("price","Selling price per kg (₦)",l?l.price:"")}
 ${f("recv","Stock received (kg)",0)}${f("count","Physical stock count at close (kg)","")}
 ${f("exp","Operating expenses (₦)",0)}${f("cash","Cash received (₦)","")}${f("bank","Bank received (₦)",0)}
 ${isOwner?f("cost","Cost per kg (₦, owner only)",l&&l.cost!=null?l.cost:""):""}
 <button class="btn" id="save">Save day</button></div>`}

/* ---------- Balances ---------- */
const coll=k=>k=="customer"?"customerLedger":"supplierLedger";
const LBL={
 customer:{ent:"Customer",title:"Customers",tot:"Customers owe you",up:"Took goods on credit",down:"Paid us"},
 supplier:{ent:"Supplier",title:"Suppliers",tot:"You owe suppliers",up:"Supplied on credit",down:"We paid supplier"}};
function partyList(k){
 const m={};
 ledgers[k].forEach(e=>{
  const p=m[e.key]=m[e.key]||{key:e.key,name:e.party,bal:0,last:""};
  p.bal+=e.dir=="up"?e.amount:-e.amount;
  if(e.date>=p.last){p.last=e.date;p.name=e.party}});
 return Object.values(m).sort((a,b)=>b.bal-a.bal)}
function ledgerForm(){
 const k=bal.kind,L=LBL[k],ps=partyList(k),cur=ps.find(p=>p.key==bal.party);
 return `<div class="card"><h2>New ${L.ent.toLowerCase()} entry</h2>
 <label>${L.ent} name<input id="lp" list="pl" autocomplete="off" value="${cur?esc(cur.name):""}"><datalist id="pl">${ps.map(p=>`<option value="${esc(p.name)}">`).join("")}</datalist></label>
 <label>What happened<select id="ldir"><option value="up">${L.up}</option><option value="down">${L.down}</option></select></label>
 <label>Amount (₦)<input id="la" type="number" inputmode="decimal" step="any"></label>
 <label>Date<input id="ld" type="date" value="${today()}"></label>
 <label>Note (optional)<input id="ln"></label>
 <button class="btn" id="lsave">Save entry</button>
 <button class="link" id="lcancel" style="width:100%;margin-top:6px">Cancel</button></div>`}
function balances(){
 if(!isOwner)bal.kind="customer";
 const k=bal.kind,L=LBL[k];
 if(bal.mode=="add")return ledgerForm();
 const ps=partyList(k),p=ps.find(x=>x.key==bal.party);
 if(p){
  const es=ledgers[k].filter(e=>e.key==p.key).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0));
  return `<button class="link" id="lback">‹ All ${L.title.toLowerCase()}</button>
  <div class="card"><h2>${esc(p.name)}</h2><div class="tile"><small>${k=="customer"?"Owes you":"You owe"}</small><b class="${p.bal>0?"warn":"ok"}">${N(p.bal)}</b></div></div>
  <button class="btn" id="ladd" style="margin-bottom:14px">+ Add entry for ${esc(p.name)}</button>
  <div class="card"><h2>History</h2>${es.map(e=>`<div class="row"><span>${e.date} · ${e.dir=="up"?L.up:L.down}${e.note?" · "+esc(e.note):""}<br><span class="note">by ${esc(e.by||"Staff")}</span></span><span><b class="${e.dir=="up"?"warn":"ok"}">${e.dir=="up"?"+":"−"}${N(e.amount)}</b>${isOwner?`<br><button class="link" data-del="${esc(e.id)}">Delete</button>`:""}</span></div>`).join("")}</div>`}
 const tot=ps.reduce((a,x)=>a+x.bal,0);
 const seg=isOwner?`<div class="seg"><button data-k="customer" aria-pressed="${k=="customer"}">Customers</button><button data-k="supplier" aria-pressed="${k=="supplier"}">Suppliers</button></div>`:"";
 return `${seg}<div class="card"><div class="tile"><small>${L.tot}</small><b>${N(tot)}</b></div></div>
 <button class="btn" id="ladd" style="margin-bottom:14px">+ New entry</button>
 <div class="card"><h2>${L.title}</h2>${ps.length?ps.map(x=>`<div class="row prow" data-p="${esc(x.key)}"><span>${esc(x.name)}</span><b class="${x.bal>0?"warn":"ok"}">${N(x.bal)}</b></div>`).join(""):`<p class="note">Nothing recorded yet.</p>`}</div>`}
function wireBal(){
 const w=$("view"),go=()=>{$("view").innerHTML="";render()};
 w.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{bal.kind=b.dataset.k;bal.party=null;bal.mode="list";go()});
 w.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{bal.party=b.dataset.p;go()});
 w.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
  if(!confirm("Delete this entry?"))return;
  try{await deleteDoc(doc(db,coll(bal.kind),b.dataset.del))}catch(e){alert("Could not delete.")}});
 const bk=$("lback");if(bk)bk.onclick=()=>{bal.party=null;bal.mode="list";go()};
 const ad=$("ladd");if(ad)ad.onclick=()=>{bal.mode="add";go()};
 const cn=$("lcancel");if(cn)cn.onclick=()=>{bal.mode="list";go()};
 const sv=$("lsave");if(sv)sv.onclick=saveLedger}
async function saveLedger(){
 const k=bal.kind,party=$("lp").value.trim(),amount=parseFloat($("la").value),date=$("ld").value;
 if(!party||isNaN(amount)||amount<=0||!date){alert("Enter the name, a positive amount and the date.");return}
 const key=party.toLowerCase(),id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
 try{
  await setDoc(doc(db,coll(k),id),{id,key,party,dir:$("ldir").value,amount,date,note:$("ln").value.trim(),by:(me.email||"").split("@")[0],uid:me.uid,ts:Date.now()});
  bal.party=key;bal.mode="list";msg="Entry saved";$("view").innerHTML="";render()
 }catch(e){alert("Could not save. Check your connection and try again.")}}

/* ---------- Inventory ---------- */
const TL={in:"Received",out:"Sold / used",loan:"Loaned out",return:"Returned",adjust:"Count correction"};
const sgn=e=>(e.type=="in"||e.type=="return"||e.type=="adjust")?e.qty:-e.qty;
function stockMap(){
 const m={};
 invLog.forEach(e=>{
  const p=m[e.key]=m[e.key]||{key:e.key,name:e.item,qty:0,last:""};
  p.qty+=sgn(e);
  if(e.date>=p.last){p.last=e.date;p.name=e.item}});
 return m}
function loanMap(){
 const m={};
 invLog.forEach(e=>{
  if(e.type!="loan"&&e.type!="return")return;
  const k=e.ckey+"|"+e.key,p=m[k]=m[k]||{ckey:e.ckey,key:e.key,cust:e.cust,item:e.item,qty:0};
  p.qty+=e.type=="loan"?e.qty:-e.qty;p.cust=e.cust;p.item=e.item});
 return Object.values(m)}
function invForm(){
 const sm=stockMap(),items=Object.values(sm),cur=inv.item&&sm[inv.item];
 const cs=[...new Set([...partyList("customer").map(p=>p.name),...loanMap().map(x=>x.cust)])];
 return `<div class="card"><h2>Record movement</h2>
 <label>Item<input id="iitem" list="il" autocomplete="off" placeholder="e.g. 12.5kg filled cylinder" value="${cur?esc(cur.name):""}"><datalist id="il">${items.map(p=>`<option value="${esc(p.name)}">`).join("")}</datalist></label>
 <label>What happened<select id="itype"><option value="in">Received into stock</option><option value="out">Sold / used</option><option value="loan">Loaned out to customer</option><option value="return">Returned by customer</option><option value="count">Stock count (type what you counted)</option></select></label>
 <label>Quantity<input id="iq" type="number" inputmode="numeric" step="1" min="0"></label>
 <label id="icw" hidden>Customer<input id="icu" list="icl" autocomplete="off"><datalist id="icl">${cs.map(n=>`<option value="${esc(n)}">`).join("")}</datalist></label>
 <label>Date<input id="idate" type="date" value="${today()}"></label>
 <label>Note (optional)<input id="inote"></label>
 <button class="btn" id="isave">Save</button>
 <button class="link" id="icancel" style="width:100%;margin-top:6px">Cancel</button></div>`}
function invView(){
 if(inv.mode=="add")return invForm();
 const sm=stockMap(),items=Object.values(sm).sort((a,b)=>a.name.localeCompare(b.name));
 const p=inv.item&&sm[inv.item];
 if(p){
  const es=invLog.filter(e=>e.key==p.key).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0));
  return `<button class="link" id="iback">‹ All items</button>
  <div class="card"><h2>${esc(p.name)}</h2><div class="tile"><small>In stock</small><b class="${p.qty<0?"warn":""}">${p.qty}</b></div></div>
  <button class="btn" id="iadd" style="margin-bottom:14px">+ Record movement</button>
  <div class="card"><h2>History</h2>${es.map(e=>`<div class="row"><span>${e.date} · ${TL[e.type]}${e.cust?" · "+esc(e.cust):""}${e.note?" · "+esc(e.note):""}<br><span class="note">by ${esc(e.by||"Staff")}</span></span><span><b class="${sgn(e)>0?"ok":"warn"}">${sgn(e)>0?"+":""}${sgn(e)}</b>${isOwner?`<br><button class="link" data-idel="${esc(e.id)}">Delete</button>`:""}</span></div>`).join("")}</div>`}
 const seg=`<div class="seg"><button data-iv="stock" aria-pressed="${inv.view=="stock"}">In stock</button><button data-iv="loans" aria-pressed="${inv.view=="loans"}">On loan</button></div>`;
 const add=`<button class="btn" id="iadd" style="margin-bottom:14px">+ Record movement</button>`;
 if(inv.view=="loans"){
  const ls=loanMap().filter(x=>x.qty!=0).sort((a,b)=>a.cust.localeCompare(b.cust)||a.item.localeCompare(b.item));
  const tot=ls.reduce((a,x)=>a+x.qty,0);
  return `${seg}<div class="card"><div class="tile"><small>Total items on loan</small><b>${tot}</b></div></div>${add}
  <div class="card"><h2>Items on loan</h2>${ls.length?ls.map(x=>`<div class="row"><span>${esc(x.cust)} · ${esc(x.item)}</span><b class="${x.qty>0?"warn":"ok"}">${x.qty}</b></div>`).join(""):`<p class="note">Nothing on loan.</p>`}</div>`}
 return `${seg}${add}<div class="card"><h2>Items in stock</h2>${items.length?items.map(x=>`<div class="row prow" data-i="${esc(x.key)}"><span>${esc(x.name)}</span><b class="${x.qty<0?"warn":""}">${x.qty}</b></div>`).join(""):`<p class="note">No items yet. Tap Record movement and add your first item, for example "12.5kg filled cylinder", with a stock count.</p>`}</div>`}
function wireInv(){
 const w=$("view"),go=()=>{$("view").innerHTML="";render()};
 w.querySelectorAll("[data-iv]").forEach(b=>b.onclick=()=>{inv.view=b.dataset.iv;go()});
 w.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{inv.item=b.dataset.i;go()});
 w.querySelectorAll("[data-idel]").forEach(b=>b.onclick=async()=>{
  if(!confirm("Delete this entry?"))return;
  try{await deleteDoc(doc(db,"inventoryLog",b.dataset.idel))}catch(e){alert("Could not delete.")}});
 const bk=$("iback");if(bk)bk.onclick=()=>{inv.item=null;go()};
 const ad=$("iadd");if(ad)ad.onclick=()=>{inv.mode="add";go()};
 const cn=$("icancel");if(cn)cn.onclick=()=>{inv.mode="list";go()};
 const t=$("itype");if(t){const f=()=>{$("icw").hidden=!(t.value=="loan"||t.value=="return")};t.onchange=f;f()}
 const sv=$("isave");if(sv)sv.onclick=saveInv}
async function saveInv(){
 const item=$("iitem").value.trim(),t=$("itype").value,q=parseFloat($("iq").value),cust=$("icu").value.trim(),date=$("idate").value;
 if(!item||isNaN(q)||q<0||!date||(t!="count"&&q==0)){alert("Enter the item, a quantity and the date.");return}
 const isLoan=t=="loan"||t=="return";
 if(isLoan&&!cust){alert("Enter the customer.");return}
 const key=item.toLowerCase(),ckey=cust.toLowerCase(),sm=stockMap(),curQ=sm[key]?sm[key].qty:0;
 let type=t,qty=q,note=$("inote").value.trim();
 if(t=="count"){
  qty=q-curQ;type="adjust";
  if(qty==0){alert("That matches the current stock. Nothing to record.");return}
  note="Count: "+q+(note?" · "+note:"")}
 else if((t=="out"||t=="loan")&&curQ-q<0&&!confirm("This takes "+item+" below zero ("+(curQ-q)+"). Save anyway?"))return;
 if(t=="return"){
  const o=loanMap().find(x=>x.ckey==ckey&&x.key==key),have=o?o.qty:0;
  if(q>have&&!confirm(cust+" only has "+have+" of "+item+" on loan. Save anyway?"))return}
 const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
 try{
  await setDoc(doc(db,"inventoryLog",id),{id,key,item,type,qty,date,note,cust:isLoan?cust:"",ckey:isLoan?ckey:"",by:(me.email||"").split("@")[0],uid:me.uid,ts:Date.now()});
  inv.item=key;inv.mode="list";msg="Saved";$("view").innerHTML="";render()
 }catch(e){alert("Could not save. Check your connection and try again.")}}

/* ---------- Render ---------- */
function render(){
 const rs=rows(),v=$("app");
 if(tab!="history")hist.day=null;
 if(!$("view")){v.innerHTML=`<nav role="tablist"><button data-tab="report">Report</button><button data-tab="entry">Add day</button><button data-tab="balances">Balances</button><button data-tab="inventory">Inventory</button><button data-tab="history">History</button></nav><div id="view"></div>`;
  v.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;if(tab=="balances"){bal.mode="list";bal.party=null}if(tab=="inventory"){inv.mode="list";inv.item=null}if(tab=="history")hist.day=null;$("view").innerHTML="";render()})}
 v.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab==tab));
 const w=$("view");
 if(tab=="entry"){if(!w.querySelector("#save")){w.innerHTML=entry(rs);$("save").onclick=save}}
 else if(tab=="balances"){w.innerHTML=balances();wireBal()}
 else if(tab=="inventory"){w.innerHTML=invView();wireInv()}
 else if(!rs.length)w.innerHTML=`<div class="card"><h2>No days recorded yet</h2><p class="note">Open Add day and enter the first day’s figures.</p></div>`;
 else if(tab=="history"){w.innerHTML=historyView(rs);wireHist()}
 else w.innerHTML=report(rs[rs.length-1]);
 if(msg){w.insertAdjacentHTML("beforeend",`<div class="toast" role="status">${msg}</div>`);msg="";setTimeout(()=>document.querySelector(".toast")?.remove(),2200)}}
function redraw(){
 if(tab=="entry"&&$("save"))return;
 if(tab=="balances"&&bal.mode=="add"&&$("lsave"))return;
 if(tab=="inventory"&&inv.mode=="add"&&$("isave"))return;
 $("view").innerHTML="";render()}
async function save(){
 const g=i=>$(i)?.value,n=i=>parseFloat(g(i));
 const need=["sold","price","recv","count","exp","cash","bank"].concat(sales.length?[]:["open"]);
 if(!g("date")||need.some(i=>isNaN(n(i)))){alert("Fill in every field. Use 0 where nothing applies.");return}
 const date=g("date");
 if(!isOwner&&sales.some(s=>s.date==date)){alert("That day is already saved. Ask the owner to correct it.");return}
 const prev=sales.filter(s=>s.date<date).pop(),open=prev?prev.count:n("open");
 if(isNaN(open)){alert("Opening stock needed for this date.");return}
 const costVal=n("cost");
 try{
  await setDoc(doc(db,"sales",date),{date,open,sold:n("sold"),price:n("price"),recv:n("recv"),count:n("count"),exp:n("exp"),cash:n("cash"),bank:n("bank"),by:(me.email||"").split("@")[0],uid:me.uid});
  if(isOwner&&!isNaN(costVal))await setDoc(doc(db,"owner","cost-"+date),{date,cost:costVal});
  msg="Day saved";tab="report";$("view").innerHTML="";render()
 }catch(e){alert("Could not save. Check your connection and try again.")}}

$("out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
 unsubs.forEach(f=>f());unsubs=[];sales=[];costs={};ledgers={customer:[],supplier:[]};invLog=[];me=u;
 if(!u){loginView();return}
 try{
  const r=await getDoc(doc(db,"roles",u.uid));
  if(!r.exists()){$("who").textContent=u.email;$("out").hidden=false;$("app").innerHTML=`<div class="card"><h2>Access not set up</h2><p class="note">Your account has no role yet. Ask the owner to add it.</p></div>`;return}
  isOwner=r.data().role=="owner";
  $("who").textContent=(isOwner?"Owner view · ":"Staff view · ")+u.email;$("out").hidden=false;
  $("app").innerHTML="";render();
  unsubs.push(onSnapshot(collection(db,"sales"),s=>{sales=s.docs.map(d=>d.data()).sort((a,b)=>a.date<b.date?-1:1);redraw()},()=>{$("app").innerHTML='<div class="card warn">Could not load records.</div>'}));
  unsubs.push(onSnapshot(collection(db,"customerLedger"),s=>{ledgers.customer=s.docs.map(d=>d.data());redraw()},()=>{}));
  unsubs.push(onSnapshot(collection(db,"inventoryLog"),s=>{invLog=s.docs.map(d=>d.data());redraw()},()=>{}));
  if(isOwner){
   unsubs.push(onSnapshot(collection(db,"owner"),s=>{costs={};s.docs.forEach(d=>{const x=d.data();costs[x.date]=x.cost});redraw()},()=>{}));
   unsubs.push(onSnapshot(collection(db,"supplierLedger"),s=>{ledgers.supplier=s.docs.map(d=>d.data());redraw()},()=>{}));
  }
 }catch(e){loginView("Could not connect. Check your internet and sign in again.")}
});
</script>
